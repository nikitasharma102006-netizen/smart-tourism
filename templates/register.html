<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Smart Tourism</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(rgba(0, 0, 0, 0.45),
                rgba(0, 0, 0, 0.45)),
                url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e")
                center/cover no-repeat;
        }

        .register-card {
            width: 400px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            margin-bottom: 10px;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .input-box {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;
            outline: none;
        }

        .input-box:focus {
            border-color: #0077b6;
            box-shadow: 0 0 5px rgba(0, 119, 182, 0.3);
        }

        .register-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #0077b6;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .register-btn:hover {
            background: #005f8d;
        }

        .login-text {
            margin-top: 22px;
            color: #555;
        }

        .login-text a {
            color: #0077b6;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="register-card">

        <div class="logo">🌍</div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Join Smart Tourism and start exploring!
        </p>


        <form method="POST">

            <input
                class="input-box"
                type="text"
                name="name"
                placeholder="👤 Enter Your Name"
                required
            >

            <input
                class="input-box"
                type="email"
                name="email"
                placeholder="📧 Enter Your Email"
                required
            >

            <input
                class="input-box"
                type="password"
                name="password"
                placeholder="🔒 Enter Password"
                required
            >

            <button
                class="register-btn"
                type="submit">
                ✨ Create Account
            </button>

        </form>


        <p class="login-text">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</body>

</html>
