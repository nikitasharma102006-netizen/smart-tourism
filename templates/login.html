<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Tourism</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(rgba(0, 0, 0, 0.45),
                rgba(0, 0, 0, 0.45)),
                url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee")
                center/cover no-repeat;
        }

        .login-card {
            width: 400px;
            padding: 35px;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 20px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);

            text-align: center;
        }

        .logo {
            font-size: 35px;
            margin-bottom: 10px;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .input-box {
            width: 100%;
            padding: 14px;

            margin-bottom: 16px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        .input-box:focus {
            border-color: #0077b6;

            box-shadow:
                0 0 5px rgba(0, 119, 182, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #0077b6;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #005f8d;
        }

        .register-text {
            margin-top: 22px;
            color: #555;
        }

        .register-text a {
            color: #0077b6;
            font-weight: bold;
            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="login-card">

        <div class="logo">
            🌍
        </div>

        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Login to continue your Smart Tourism journey.
        </p>


        <form method="POST">

            <input
                class="input-box"
                type="email"
                name="email"
                placeholder="📧 Enter Email"
                required
            >

            <input
                class="input-box"
                type="password"
                name="password"
                placeholder="🔒 Enter Password"
                required
            >

            <button
                class="login-btn"
                type="submit">
                🔐 Login
            </button>

        </form>


        <p class="register-text">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </p>

    </div>

</body>

</html>
