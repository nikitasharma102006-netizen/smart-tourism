<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Confirmed - Smart Tourism</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f8ff;
            padding-top: 80px;
        }

        .success-box {
            background: white;
            width: 80%;
            max-width: 500px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            color: #2c7be5;
        }

        h2 {
            color: green;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #2c7be5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            background-color: #155ab6;
        }
    </style>
</head>

<body>

    <div class="success-box">

        <h1>🌍 Smart Tourism</h1>

        <h2>🎉 Booking Confirmed Successfully!</h2>

        <p>Thank you for booking with Smart Tourism.</p>

        <p>Your booking has been saved successfully.</p>

        <a href="/dashboard" class="button">
            🏠 Back to Dashboard
        </a>

        <br>

        <a href="/booking" class="button">
            📝 Make Another Booking
        </a>

    </div>

</body>
</html>
